<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page_title" data-i18n="about">AR Center</title>
  <style>
  :root {
        --primary-color: #ad28dc; 
        --background-color: #f7f9fc; 
        --text-color: #333333;
    }
    .dark-mode { 
        --primary-color: #ad28dc; 
        --background-color: #0a0a0c; 
        --text-color: #f0f0f0; 
    }
    body {
      background-color: var(--background-color);
    }
  .container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 23vh;
    overflow: hidden; 
    background-color: var(--background-color);
  }
  h3 {
  margin: 0; 
  display: flex;
  align-items: center;
  color: var(--text-color);
}
  .slide-in-center {
    width: 150px;
    height: auto;
    animation: slideLeftToCenter 1.2s ease-out 0.2s forwards;
    opacity: 0;
  }
  @keyframes slideLeftToCenter {
    0% {
      opacity: 0;
      transform: translateX(-100vw);
    }
    100% {
      opacity: 1;
      transform: translateX(0);
    }
  }
  .slide-in-right {
    width: 180px;
    height: 180px;
    animation: slideRightToCenter 1.2s ease-out 0.3s forwards;
    opacity: 0;
  }
  @keyframes slideRightToCenter {
    0% {
      opacity: 0;
      transform: translateX(100vw);
    }
    100% {
      opacity: 1;
      transform: translateX(0);
    }
  }
   .slide-in-button1 {
    animation: slideTopToCenter 1.2s ease-out 0.2s forwards;
    opacity: 0;
  }
  @keyframes slideTopToCenter {
    0% {
      opacity: 0;
      transform: translateX(100vw);
    }
    100% {
      opacity: 1;
      transform: translateX(0);
    }
  }
   .slide-in-button2 {
    animation: slideTopToCenter 1.2s ease-out 0.4s forwards;
    opacity: 0;
  }
  @keyframes slideTopToCenter {
    0% {
      opacity: 0;
      transform: translateY(100vw);
    }
    100% {
      opacity: 1;
      transform: translateY(0);
    }
  }
  </style>
</head>
<body>
